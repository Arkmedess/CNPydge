[package]
name = "cnpydge-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
memmap2 = "0.9"
rayon = "1.10"
arrow = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }
thiserror = "2.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parser_bench"
harness = false
