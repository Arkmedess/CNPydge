[package]
name = "cnpydge-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
memmap2 = "0.9"

[dev-dependencies]
criterion = "0.5" # benchmark

[[bench]]
name = "parser_bench" # arquivo de benchmark
harness = false
