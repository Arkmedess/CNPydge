[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "cnpydge"
version = "0.1.0"
description = "Motor em Rust de alta performance com orquestração em Python para dados públicos de CNPJ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
]

[tool.zuban]
python_executable = ".venv/bin/python"
mypy_path = ["orchestrator"]

[tool.maturin]
manifest-path = "engine/Cargo.toml"
module-name = "cnpydge._core"
python-source = "orchestrator"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["orchestrator/cnpydge"]
omit = ["orchestrator/cnpydge/_core.*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80


