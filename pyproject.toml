[project]
name = "cnpj-ultra-importer"
version = "0.1.0"
description = "Importador de alta performance da base publica de CNPJ da Receita Federal (Python 3.14 + Rust)."
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "loguru>=0.7",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "orjson>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "maturin>=1.7"]

[project.scripts]
cnpj-importer = "python.entrypoints.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["python*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
